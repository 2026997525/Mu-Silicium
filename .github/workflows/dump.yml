name: Diagnose Aston DSC

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Dump DSC structure
        run: |
          echo "========== aston.dsc include 指令 =========="
          grep -n "!include\|!INCLUDE" Platforms/OnePlus/astonPkg/aston.dsc || echo "(none)"

          echo ""
          echo "========== aston.dsc [LibraryClasses] 段 =========="
          awk '/^\[LibraryClasses\]/{f=1} f{print} /^\[/{if(f && $0 !~ /LibraryClasses/){exit}}' \
            Platforms/OnePlus/astonPkg/aston.dsc

          echo ""
          echo "========== 找所有可用的平台 DSC =========="
          find Platforms -name "*.dsc" -maxdepth 3 2>/dev/null | head -20

          echo ""
          echo "========== SiliciumPkg.dsc.inc 存在性 =========="
          find . -name "SiliciumPkg.dsc.inc" -not -path "./.git/*" 2>/dev/null

          echo ""
          echo "========== SiliciumPkg.dsc.inc 的 [LibraryClasses] 段 =========="
          INC=$(find . -name "SiliciumPkg.dsc.inc" -not -path "./.git/*" 2>/dev/null | head -1)
          if [ -n "$INC" ]; then
            awk '/^\[LibraryClasses\]/{f=1} f{print} /^\[/{if(f && $0 !~ /LibraryClasses/){exit}}' "$INC" | head -60
          fi

          echo ""
          echo "========== 对比：giulia.dsc（Active 设备）的 include =========="
          if [ -f "Platforms/OnePlus/giuliaPkg/giulia.dsc" ]; then
            grep -n "!include\|!INCLUDE" Platforms/OnePlus/giuliaPkg/giulia.dsc || echo "(none)"
          else
            find Platforms -iname "*giulia*" -name "*.dsc" 2>/dev/null
          fi
