name: Dump Platform Inc Files

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Find and dump platform inc files
        run: |
          echo "========== 所有 KailuaPkg 相关文件 =========="
          find . -iname "*Kailua*" -not -path "./.git/*" 2>/dev/null

          echo ""
          echo "========== 所有 LanaiPkg 相关文件 =========="
          find . -iname "*Lanai*" -not -path "./.git/*" 2>/dev/null

          echo ""
          echo "========== KailuaPkg.dsc.inc 的完整 LibraryClasses =========="
          INC=$(find . -name "KailuaPkg.dsc.inc" -not -path "./.git/*" 2>/dev/null | head -1)
          if [ -n "$INC" ]; then
            echo "File: $INC"
            awk '/^\[LibraryClasses\]/{f=1} f{print} /^\[/{if(f && $0 !~ /LibraryClasses/){exit}}' "$INC"
          else
            echo "(KailuaPkg.dsc.inc not found)"
          fi

          echo ""
          echo "========== LanaiPkg.dsc.inc 的完整 LibraryClasses =========="
          INC2=$(find . -name "LanaiPkg.dsc.inc" -not -path "./.git/*" 2>/dev/null | head -1)
          if [ -n "$INC2" ]; then
            echo "File: $INC2"
            awk '/^\[LibraryClasses\]/{f=1} f{print} /^\[/{if(f && $0 !~ /LibraryClasses/){exit}}' "$INC2"
          else
            echo "(LanaiPkg.dsc.inc not found)"
          fi

          echo ""
          echo "========== BootLogoLib 在整个仓库里有哪些实现 =========="
          grep -rn "LIBRARY_CLASS.*BootLogoLib\|BootLogoLib" \
            --include="*.inf" --include="*.inc" --include="*.dsc" \
            . 2>/dev/null | grep -v "^./.git" | head -20 || echo "(none)"
