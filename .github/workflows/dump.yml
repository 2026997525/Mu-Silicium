name: Dump ArmGic info

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Clone simple-init
        run: |
          rm -rf Platforms/OnePlus/SimpleInit
          git clone --recursive --depth 1 \
            https://github.com/BigfootACA/simple-init.git \
            Platforms/OnePlus/SimpleInit

      - name: Dump
        run: |
          echo "=== aston.dsc 里所有 ArmGicLib ==="
          grep -rn "ArmGicLib" Platforms/OnePlus/astonPkg/ || echo "(none)"

          echo ""
          echo "=== Mu_Basecore 里可用的 ArmGicLib 实现 ==="
          find Mu_Basecore -iname "ArmGicLib.inf" 2>/dev/null || echo "(none)"
          find Common -iname "ArmGicLib.inf" 2>/dev/null || true
          find Silicon -iname "ArmGicLib.inf" 2>/dev/null || true

          echo ""
          echo "=== SimpleInitMain.inf ==="
          cat -n Platforms/OnePlus/SimpleInit/src/main/SimpleInitMain.inf

          echo ""
          echo "=== SimpleInit.inc LibraryClasses 段 ==="
          awk '/^\[LibraryClasses\]/{f=1} f{print} /^\[/{if(f && $0 !~ /LibraryClasses/){exit}}' \
            Platforms/OnePlus/SimpleInit/SimpleInit.inc

          echo ""
          echo "=== SimpleInitBootLinux.inf ==="
          cat -n Platforms/OnePlus/SimpleInit/src/linux-boot/SimpleInitBootLinux.inf

          echo ""
          echo "=== SimpleInitGUI.inf 里的 ArmGicLib 引用 ==="
          grep -n "ArmGicLib\|LibraryClasses" \
            Platforms/OnePlus/SimpleInit/src/gui/SimpleInitGUI.inf || true
