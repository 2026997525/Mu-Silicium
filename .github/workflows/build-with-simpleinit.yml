name: Build Mu-aston with SimpleInit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Checkout Mu-Silicium
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Clone simple-init
        run: |
          rm -rf Platforms/OnePlus/SimpleInit
          git clone --recursive --depth 1 \
            https://github.com/BigfootACA/simple-init.git \
            Platforms/OnePlus/SimpleInit

      - name: Fix SimpleInit.dec references
        run: |
          find Platforms/OnePlus/SimpleInit -name "*.inf" -type f -exec \
            sed -i -E 's|^([[:space:]]*)SimpleInit\.dec[[:space:]]*$|\1SimpleInit/SimpleInit.dec|' {} \;

      - name: Strip ArmGicLib
        run: |
          sed -i -E '/^[[:space:]]*ArmGicLib[[:space:]]*$/d' \
            Platforms/OnePlus/SimpleInit/src/linux-boot/SimpleInitBootLinux.inf

      - name: Auto-scan and resolve
        run: |
          python3 << 'PYEOF'
          import os
          import re

          SIMPLE_ROOT = "Platforms/OnePlus/SimpleInit"
          DSC = "Platforms/OnePlus/astonPkg/aston.dsc"

          # ==== 1. 遍历整个仓库，收集所有 .inf 的 LIBRARY_CLASS 声明 ====
          inf_map = {}    # cls -> inf path (relative)
          for root, dirs, files in os.walk("."):
              if any(p in root for p in ["/.git", "/Build", "/Conf"]):
                  continue
              for f in files:
                  if not f.endswith(".inf"):
                      continue
                  inf_path = os.path.join(root, f)
                  rel = os.path.relpath(inf_path, ".").replace("\\", "/")
                  try:
                      content = open(inf_path, errors='ignore').read()
                  except:
                      continue
                  for m in re.finditer(r'LIBRARY_CLASS\s*=\s*([\w\-]+)', content):
                      cls = m.group(1)
                      if cls not in inf_map:
                          inf_map[cls] = rel

          print(f"=== 全仓 LIBRARY_CLASS 池: {len(inf_map)} ===")

          # ==== 2. 收集 SimpleInit 需要的库类 ====
          needed = set()
          for root, dirs, files in os.walk(SIMPLE_ROOT):
              for f in files:
                  if not f.endswith(".inf"):
                      continue
                  p = os.path.join(root, f)
                  in_lib = False
                  for line in open(p, errors='ignore'):
                      s = line.strip()
                      if re.match(r'^\[LibraryClasses(\.|$|,)', s):
                          in_lib = True
                          continue
                      if in_lib and s.startswith('['):
                          in_lib = False
                          continue
                      if in_lib and s and not s.startswith('#'):
                          needed.add(s.split('|')[0].strip())

          print(f"=== SimpleInit 需要: {len(needed)} ===")
          for n in sorted(needed):
              print(f"  need: {n}")

          # ==== 3. aston.dsc 已声明 ====
          already = set()
          in_lib = False
          for line in open(DSC, errors='ignore'):
              s = line.strip()
              if re.match(r'^\[LibraryClasses(\.|$|,)', s):
                  in_lib = True
                  continue
              if in_lib and s.startswith('['):
                  in_lib = False
                  continue
              if in_lib and '|' in s:
                  already.add(s.split('|', 1)[0].strip())

          print(f"=== aston.dsc 已声明: {len(already)} ===")

          # ==== 4. 计算差集 & 解析 ====
          missing = sorted(needed - already)
          print(f"\n=== 缺失 ({len(missing)}) ===")

          resolved = []
          unresolved = []
          for cls in missing:
              if cls in inf_map:
                  resolved.append(f"{cls}|{inf_map[cls]}")
                  print(f"  [OK]   {cls} -> {inf_map[cls]}")
              else:
                  unresolved.append(cls)
                  print(f"  [FAIL] {cls} (无实现)")

          # ==== 5. 硬编码兜底：常用 EDK2 标准库 ====
          HARDCODED = {
              "BootLogoLib": "Mu_Basecore/MdeModulePkg/Library/BootLogoLib/BootLogoLib.inf",
              "UefiBootManagerLib": "Mu_Basecore/MdeModulePkg/Library/UefiBootManagerLib/UefiBootManagerLib.inf",
              "UefiBootServicesTableLib": "Mu_Basecore/MdePkg/Library/UefiBootServicesTableLib/UefiBootServicesTableLib.inf",
              "UefiRuntimeServicesTableLib": "Mu_Basecore/MdePkg/Library/UefiRuntimeServicesTableLib/UefiRuntimeServicesTableLib.inf",
              "UefiLib": "Mu_Basecore/MdePkg/Library/UefiLib/UefiLib.inf",
              "UefiApplicationEntryPoint": "Mu_Basecore/MdePkg/Library/UefiApplicationEntryPoint/UefiApplicationEntryPoint.inf",
              "UefiDriverEntryPoint": "Mu_Basecore/MdePkg/Library/UefiDriverEntryPoint/UefiDriverEntryPoint.inf",
              "DevicePathLib": "Mu_Basecore/MdePkg/Library/UefiDevicePathLib/UefiDevicePathLib.inf",
              "MemoryAllocationLib": "Mu_Basecore/MdePkg/Library/UefiMemoryAllocationLib/UefiMemoryAllocationLib.inf",
              "PcdLib": "Mu_Basecore/MdePkg/Library/BasePcdLibNull/BasePcdLibNull.inf",
              "BaseLib": "Mu_Basecore/MdePkg/Library/BaseLib/BaseLib.inf",
              "BaseMemoryLib": "Mu_Basecore/MdePkg/Library/BaseMemoryLib/BaseMemoryLib.inf",
              "DebugLib": "Mu_Basecore/MdePkg/Library/BaseDebugLibNull/BaseDebugLibNull.inf",
              "DebugPrintErrorLevelLib": "Mu_Basecore/MdePkg/Library/BaseDebugPrintErrorLevelLib/BaseDebugPrintErrorLevelLib.inf",
              "ReportStatusCodeLib": "Mu_Basecore/MdeModulePkg/Library/DxeReportStatusCodeLib/DxeReportStatusCodeLib.inf",
              "PrintLib": "Mu_Basecore/MdePkg/Library/BasePrintLib/BasePrintLib.inf",
              "SynchronizationLib": "Mu_Basecore/MdePkg/Library/BaseSynchronizationLib/BaseSynchronizationLib.inf",
              "CacheMaintenanceLib": "Mu_Basecore/ArmPkg/Library/ArmCacheMaintenanceLib/ArmCacheMaintenanceLib.inf",
          }

          for cls in unresolved[:]:
              if cls in HARDCODED:
                  inf_path = HARDCODED[cls]
                  if os.path.exists(inf_path):
                      resolved.append(f"{cls}|{inf_path}")
                      unresolved.remove(cls)
                      print(f"  [HC]   {cls} -> {inf_path}")

          with open("/tmp/auto_libs.txt", "w") as f:
              for r in resolved:
                  f.write(r + "\n")

          if unresolved:
              print(f"\n!!! 未解析: {unresolved}")
              # 不退出，让后续步骤继续，看看具体报错
          else:
              print(f"\n全部解析完成")
          PYEOF

      - name: Patch aston.dsc
        run: |
          DSC="Platforms/OnePlus/astonPkg/aston.dsc"
          INC="Platforms/OnePlus/SimpleInit/SimpleInit.inc"

          if grep -q "SimpleInit injected begin" "$DSC"; then
            echo "DSC already patched."
            exit 0
          fi

          python3 << 'PYEOF'
          import os

          dsc = "Platforms/OnePlus/astonPkg/aston.dsc"
          inc = "Platforms/OnePlus/SimpleInit/SimpleInit.inc"
          auto_file = "/tmp/auto_libs.txt"

          def section(path, name):
              out, inside = [], False
              for line in open(path):
                  s = line.strip()
                  if s == '[' + name + ']':
                      inside = True
                      continue
                  if inside and s.startswith('[') and s.endswith(']'):
                      break
                  if inside:
                      out.append(line.rstrip('\n'))
              return out

          SIMPLE_PREFIXES = ('libs/', 'src/')
          PATH_SUBSTITUTIONS = {
              'EmbeddedPkg/Library/FdtLib/FdtLib.inf':
                  'MdePkg/Library/BaseFdtLib/BaseFdtLib.inf',
          }

          def fix_path(path):
              path = path.strip()
              if path in PATH_SUBSTITUTIONS:
                  return PATH_SUBSTITUTIONS[path]
              if any(path.startswith(p) for p in SIMPLE_PREFIXES):
                  return 'SimpleInit/' + path
              return path

          def prefix_lib(l):
              l = l.strip()
              if not l or l.startswith('#'):
                  return None
              if '|' in l:
                  cls, p = l.split('|', 1)
                  return f'{cls.strip()}|{fix_path(p)}'
              return fix_path(l)

          def prefix_comp(l):
              l = l.strip()
              if not l or l.startswith('#'):
                  return None
              return fix_path(l)

          explicit_libs = [p for p in (prefix_lib(l) for l in section(inc, 'LibraryClasses')) if p]
          comps = [p for p in (prefix_comp(l) for l in section(inc, 'Components')) if p]

          auto_libs = []
          if os.path.exists(auto_file):
              for line in open(auto_file):
                  line = line.strip()
                  if line:
                      auto_libs.append(line)

          # 合并成单个 LibraryClasses 段
          seen = set()
          merged_libs = []
          for l in explicit_libs + auto_libs:
              cls = l.split('|', 1)[0].strip()
              if cls in seen:
                  continue
              seen.add(cls)
              merged_libs.append(l)

          with open(dsc, 'a') as f:
              f.write('\n# ===== SimpleInit injected begin =====\n')
              if merged_libs:
                  f.write('[LibraryClasses]\n')
                  for l in merged_libs:
                      f.write('  ' + l + '\n')
              if comps:
                  f.write('\n[Components]\n')
                  for c in comps:
                      f.write('  ' + c + '\n')
              f.write('# ===== SimpleInit injected end =====\n')

          print(f'Injected: {len(merged_libs)} libs, {len(comps)} components')
          for l in merged_libs:
              print('  LIB:', l)
          PYEOF

          echo "=== tail of DSC ==="
          tail -100 "$DSC"

      - name: Setup environment and build
        run: |
          bash ./setup_env.sh -p apt
          python3 build_uefi.py -d aston

      - name: Locate outputs
        if: always()
        run: |
          find . -iname "Mu-aston*" -not -path "./.git/*" 2>/dev/null || true
          find . -iname "SimpleInit*.efi" -not -path "./.git/*" 2>/dev/null || true
          find Build/astonPkg -maxdepth 3 -type f 2>/dev/null | head -30 || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mu-aston-with-SimpleInit
          path: |
            **/Mu-aston*
            **/SimpleInit*.efi
          if-no-files-found: warn
          retention-days: 30
