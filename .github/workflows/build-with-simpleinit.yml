name: Build Mu-aston with SimpleInit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          df -h

      - name: Checkout Mu-Silicium
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Clone simple-init
        run: |
          mkdir -p External
          git clone --recursive --depth 1 \
            https://github.com/BigfootACA/simple-init.git \
            External/simple-init

      - name: Patch aston.dsc with SimpleInit components
        run: |
          MAIN_DSC="Platforms/OnePlus/astonPkg/aston.dsc"
          SIMPLEINC="External/simple-init/SimpleInit.inc"

          if [ ! -f "$MAIN_DSC" ] || [ ! -f "$SIMPLEINC" ]; then
            echo "ERROR: Missing $MAIN_DSC or $SIMPLEINC"
            exit 1
          fi

          # 避免重复注入
          if grep -q "SimpleInit" "$MAIN_DSC"; then
            echo "Already patched, skipping."
            exit 0
          fi

          # 生成路径前缀为 External/simple-init/ 的 LibraryClasses 和 Components
          echo "" >> "$MAIN_DSC"
          echo "# ===== SimpleInit injected begin =====" >> "$MAIN_DSC"
          echo "[LibraryClasses]" >> "$MAIN_DSC"

          # 提取 SimpleInit.inc 的 [LibraryClasses] 段，加上路径前缀
          awk '/^\[LibraryClasses\]/{flag=1; next} /^\[/{flag=0} flag' "$SIMPLEINC" \
            | sed 's|^  \([A-Za-z0-9_]*\)|  \1|; s|\(|External/simple-init/|; s|External/simple-init/|External/simple-init/|; s|\.inf|.inf|' \
            | sed 's|External/simple-init/External/simple-init/|External/simple-init/|' \
            >> "$MAIN_DSC"

          echo "" >> "$MAIN_DSC"
          echo "[Components]" >> "$MAIN_DSC"

          awk '/^\[Components\]/{flag=1; next} /^\[/{flag=0} flag' "$SIMPLEINC" \
            | grep -v '^\s*$' \
            | sed 's|^  |  External/simple-init/|' \
            >> "$MAIN_DSC"

          echo "# ===== SimpleInit injected end =====" >> "$MAIN_DSC"

          echo "=== Injected section ==="
          tail -60 "$MAIN_DSC"

      - name: Build UEFI
        run: |
          export PACKAGES_PATH="$PWD:$PWD/External/simple-init"
          bash ./setup_env.sh -p apt
          python3 build_uefi.py -d aston

      - name: Locate outputs
        if: always()
        run: |
          echo "=== Mu-aston images ==="
          find . -iname "Mu-aston*" -not -path "./.git/*" 2>/dev/null
          echo "=== SimpleInit*.efi ==="
          find . -iname "SimpleInit*.efi" -not -path "./.git/*" 2>/dev/null
          echo "=== Build dir ==="
          ls -la Build/ 2>/dev/null || echo "no Build/"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mu-aston-with-SimpleInit
          path: |
            **/Mu-aston*
            **/SimpleInit*.efi
          if-no-files-found: warn
          retention-days: 30
