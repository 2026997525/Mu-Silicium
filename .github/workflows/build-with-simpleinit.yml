name: Build Mu-aston with SimpleInit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Checkout Mu-Silicium
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Clone simple-init into Platforms/OnePlus/SimpleInit
        run: |
          rm -rf Platforms/OnePlus/SimpleInit
          git clone --recursive --depth 1 \
            https://github.com/BigfootACA/simple-init.git \
            Platforms/OnePlus/SimpleInit

      - name: Verify simple-init layout
        run: |
          echo "=== simple-init root ==="
          ls -la Platforms/OnePlus/SimpleInit/
          echo "=== SimpleInit.dec ==="
          find Platforms/OnePlus/SimpleInit -maxdepth 1 -name "SimpleInit.dec"
          echo "=== SimpleInit.inc ==="
          find Platforms/OnePlus/SimpleInit -maxdepth 1 -name "SimpleInit.inc"
          echo "=== SimpleInit.inc raw content ==="
          cat Platforms/OnePlus/SimpleInit/SimpleInit.inc

      - name: Patch aston.dsc
        run: |
          DSC="Platforms/OnePlus/astonPkg/aston.dsc"
          [ -f "$DSC" ] || { echo "ERROR: $DSC not found"; exit 1; }

          if grep -q "SimpleInit" "$DSC"; then
            echo "DSC already patched."
            exit 0
          fi

          python3 << 'PYEOF'
          dsc = "Platforms/OnePlus/astonPkg/aston.dsc"
          inc = "Platforms/OnePlus/SimpleInit/SimpleInit.inc"

          def section(path, name):
              out, inside = [], False
              for line in open(path):
                  s = line.strip()
                  if s == '[' + name + ']':
                      inside = True
                      continue
                  if inside and s.startswith('[') and s.endswith(']'):
                      break
                  if inside:
                      out.append(line.rstrip('\n'))
              return out

          # 只有这些前缀的路径才属于 SimpleInit 包内部
          SIMPLE_PREFIXES = ('libs/', 'src/')

          def fix_path(path):
              path = path.strip()
              if any(path.startswith(p) for p in SIMPLE_PREFIXES):
                  return 'SimpleInit/' + path
              return path

          def prefix_lib(l):
              l = l.strip()
              if not l or l.startswith('#'):
                  return None
              if '|' in l:
                  cls, path = l.split('|', 1)
                  return f'{cls.strip()}|{fix_path(path)}'
              return fix_path(l)

          def prefix_comp(l):
              l = l.strip()
              if not l or l.startswith('#'):
                  return None
              return fix_path(l)

          libs = [p for p in (prefix_lib(l) for l in section(inc, 'LibraryClasses')) if p]
          comps = [p for p in (prefix_comp(l) for l in section(inc, 'Components')) if p]

          with open(dsc, 'a') as f:
              f.write('\n# ===== SimpleInit injected begin =====\n')
              if libs:
                  f.write('[LibraryClasses]\n')
                  for l in libs:
                      f.write('  ' + l + '\n')
              if comps:
                  f.write('\n[Components]\n')
                  for c in comps:
                      f.write('  ' + c + '\n')
              f.write('# ===== SimpleInit injected end =====\n')

          print(f'Injected {len(libs)} libs, {len(comps)} components')
          for l in libs:
              print('  LIB:', l)
          for c in comps[:5]:
              print('  COMP:', c)
          PYEOF

          echo "=== tail of DSC ==="
          tail -60 "$DSC"

      - name: Setup environment and build
        run: |
          bash ./setup_env.sh -p apt
          python3 build_uefi.py -d aston

      - name: Locate outputs
        if: always()
        run: |
          echo "=== Mu-aston images ==="
          find . -iname "Mu-aston*" -not -path "./.git/*" 2>/dev/null || true
          echo "=== SimpleInit.efi ==="
          find . -iname "SimpleInit*.efi" -not -path "./.git/*" 2>/dev/null || true
          echo "=== Build dir ==="
          ls -la Build/ 2>/dev/null || echo "no Build/"
          echo "=== Build/astonPkg tree (if exists) ==="
          find Build/astonPkg -maxdepth 3 -type f 2>/dev/null | head -50 || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mu-aston-with-SimpleInit
          path: |
            **/Mu-aston*
            **/SimpleInit*.efi
          if-no-files-found: warn
          retention-days: 30
