name: Build Mu-aston with SimpleInit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          df -h

      - name: Checkout Mu-Silicium
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Clone simple-init
        run: |
          mkdir -p External
          git clone --recursive --depth 1 \
            https://github.com/BigfootACA/simple-init.git \
            External/simple-init

      - name: Probe simple-init structure
        id: probe
        run: |
          echo "===== simple-init root ====="
          ls -la External/simple-init/ | head -40

          echo ""
          echo "===== All .inc files in simple-init ====="
          find External/simple-init -name "*.inc" -not -path "*/.git/*" 2>/dev/null

          echo ""
          echo "===== Find SimpleInit.inc ====="
          SIMPLEINC=$(find External/simple-init -name "SimpleInit.inc" -not -path "*/.git/*" 2>/dev/null | head -1)
          echo "SIMPLEINC=$SIMPLEINC"
          echo "simpleinc_path=$SIMPLEINC" >> $GITHUB_OUTPUT

          echo ""
          echo "===== Content of SimpleInit.inc (if found) ====="
          if [ -n "$SIMPLEINC" ]; then
            cat "$SIMPLEINC"
          else
            echo "NOT FOUND"
          fi

      - name: Probe Mu-Silicium DSC targets
        id: probe_dsc
        run: |
          echo "===== DSC files mentioning aston ====="
          grep -rl -i "aston" --include="*.dsc" . 2>/dev/null | grep -v "\.git" || echo "NONE"

          echo ""
          echo "===== DSC files mentioning sm8550 ====="
          grep -rl -i "sm8550" --include="*.dsc" . 2>/dev/null | grep -v "\.git" || echo "NONE"

          echo ""
          echo "===== All DSC files (for reference) ====="
          find . -name "*.dsc" -not -path "./.git/*" 2>/dev/null | head -30

          MAIN_DSC=$(grep -rl -i "aston" --include="*.dsc" . 2>/dev/null | grep -v "\.git" | head -1)
          echo ""
          echo "MAIN_DSC=$MAIN_DSC"
          echo "main_dsc=$MAIN_DSC" >> $GITHUB_OUTPUT

          if [ -n "$MAIN_DSC" ]; then
            echo ""
            echo "===== All !include lines in main DSC ====="
            grep -n "^!include" "$MAIN_DSC" || echo "NONE"

            echo ""
            echo "===== Last 30 lines of main DSC ====="
            tail -30 "$MAIN_DSC"
          fi

      - name: Patch DSC (only if SimpleInit.inc found)
        if: steps.probe.outputs.simpleinc_path != ''
        run: |
          SIMPLEINC="${{ steps.probe.outputs.simpleinc_path }}"
          MAIN_DSC="${{ steps.probe_dsc.outputs.main_dsc }}"

          echo "SIMPLEINC: $SIMPLEINC"
          echo "MAIN_DSC: $MAIN_DSC"

          if [ -z "$MAIN_DSC" ] || [ ! -f "$MAIN_DSC" ]; then
            echo "ERROR: No main DSC found, skipping patch."
            exit 1
          fi

          # 计算从 DSC 所在目录到 SimpleInit.inc 的相对路径
          DSC_DIR=$(dirname "$MAIN_DSC")
          REL_PATH=$(realpath --relative-to="$DSC_DIR" "$PWD/$SIMPLEINC")
          echo "Relative path from DSC: $REL_PATH"

          # 检查文件是否存在
          if [ ! -f "$PWD/$SIMPLEINC" ]; then
            echo "ERROR: $SIMPLEINC does not exist, skipping patch."
            exit 1
          fi

          # 避免重复
          if grep -q "SimpleInit.inc" "$MAIN_DSC"; then
            echo "Already patched, skipping."
            exit 0
          fi

          # 插入到最后一个 !include 之后
          LAST_INCLUDE=$(grep -n "^!include" "$MAIN_DSC" | tail -1 | cut -d: -f1)
          if [ -n "$LAST_INCLUDE" ]; then
            sed -i "${LAST_INCLUDE}a !include ${REL_PATH}" "$MAIN_DSC"
          else
            printf '\n!include %s\n' "$REL_PATH" >> "$MAIN_DSC"
          fi

          echo "=== Result ==="
          grep -n "SimpleInit" "$MAIN_DSC"

      - name: Build UEFI
        run: |
          bash ./setup_env.sh -p apt
          python3 build_uefi.py -d aston

      - name: Locate outputs
        if: always()
        run: |
          echo "=== Mu-aston images ==="
          find . -iname "Mu-aston*" -not -path "./.git/*" 2>/dev/null
          echo "=== SimpleInit*.efi ==="
          find . -iname "SimpleInit*.efi" -not -path "./.git/*" 2>/dev/null
          echo "=== Build dir ==="
          ls -la Build/ 2>/dev/null || echo "no Build/"
          echo "=== Top level ==="
          ls -la

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mu-aston-with-SimpleInit
          path: |
            **/Mu-aston*
            **/SimpleInit*.efi
          if-no-files-found: warn
          retention-days: 30
