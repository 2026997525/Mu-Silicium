name: Build Mu-aston with SimpleInit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          df -h

      - name: Checkout Mu-Silicium
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Clone simple-init into External/
        run: |
          mkdir -p External
          git clone --recursive --depth 1 \
            https://github.com/BigfootACA/simple-init.git \
            External/simple-init
          echo "=== simple-init structure ==="
          ls External/simple-init/
          echo "=== SimpleInit.inc ==="
          cat External/simple-init/SimpleInit.inc 2>/dev/null || echo "NOT FOUND at root"
          find External/simple-init -name "SimpleInit.inc" -o -name "*.dsc" | head

      - name: Patch platform DSC files
        run: |
          # 找出所有包含 aston/sm8550 的 DSC 文件
          DSC_FILES=$(grep -rl -i "aston\|sm8550" --include="*.dsc" . 2>/dev/null | grep -v "\.git")

          if [ -z "$DSC_FILES" ]; then
            echo "WARNING: No DSC found with aston/sm8550. Dumping all DSC:"
            find . -name "*.dsc" -not -path "./.git/*" | head -40
            exit 1
          fi

          echo "Found DSC files to patch:"
          echo "$DSC_FILES"

          for f in $DSC_FILES; do
            echo "=== Patching $f ==="
            # 计算从 DSC 所在目录到 External/simple-init 的相对路径
            DSC_DIR=$(dirname "$f")
            REL_PATH=$(realpath --relative-to="$DSC_DIR" "$PWD/External/simple-init")

            # 避免重复注入
            if grep -q "SimpleInit.inc" "$f"; then
              echo "Already patched, skipping"
              continue
            fi

            # 在 [Components] 段落末尾之前，或者文件末尾追加 include
            # 优先找类似 !include 的位置
            if grep -q "^!include" "$f"; then
              # 在最后一个 !include 后面插入
              LAST_INCLUDE=$(grep -n "^!include" "$f" | tail -1 | cut -d: -f1)
              sed -i "${LAST_INCLUDE}a !include ${REL_PATH}/SimpleInit.inc" "$f"
            else
              # 没有 !include，直接追加到文件末尾
              echo "" >> "$f"
              echo "!include ${REL_PATH}/SimpleInit.inc" >> "$f"
            fi

            echo "--- Result ---"
            grep -n "SimpleInit" "$f"
          done

      - name: Build UEFI
        run: |
          bash ./setup_env.sh -p apt
          python3 build_uefi.py -d aston

      - name: Locate outputs
        run: |
          echo "=== Search for Mu-aston images ==="
          find . -iname "Mu-aston*" -not -path "./.git/*" 2>/dev/null | tee /tmp/outputs.txt
          echo "=== Search for SimpleInit.efi ==="
          find . -iname "SimpleInit*.efi" -not -path "./.git/*" 2>/dev/null
          echo "=== Build dir ==="
          ls -la Build/ 2>/dev/null || echo "no Build/"
          echo "=== Top level after build ==="
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mu-aston-with-SimpleInit
          path: |
            **/Mu-aston*
            **/SimpleInit*.efi
          if-no-files-found: warn
          retention-days: 30
