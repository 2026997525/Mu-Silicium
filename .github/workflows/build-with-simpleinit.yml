name: Build Mu-aston with SimpleInit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Checkout Mu-Silicium
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Clone simple-init
        run: |
          rm -rf External
          mkdir -p External
          git clone --recursive --depth 1 \
            https://github.com/BigfootACA/simple-init.git \
            External/simple-init

      - name: Patch aston.dsc
        run: |
          DSC="Platforms/OnePlus/astonPkg/aston.dsc"
          [ -f "$DSC" ] || { echo "ERROR: $DSC not found"; exit 1; }

          if grep -q "SimpleInit" "$DSC"; then
            echo "DSC already patched."
            exit 0
          fi

          python3 << 'PYEOF'
          dsc = "Platforms/OnePlus/astonPkg/aston.dsc"
          inc = "External/simple-init/SimpleInit.inc"

          def section(path, name):
              out, inside = [], False
              for line in open(path):
                  s = line.strip()
                  if s == '[' + name + ']':
                      inside = True
                      continue
                  if inside and s.startswith('[') and s.endswith(']'):
                      break
                  if inside:
                      out.append(line.rstrip('\n'))
              return out

          libs = [l for l in section(inc, 'LibraryClasses') if l.strip()]
          comps = [l for l in section(inc, 'Components') if l.strip()]

          # 路径前面加上 External/simple-init/
          def prefix(l):
              l = l.strip()
              if not l or l.startswith('#'):
                  return l
              # 已经带前缀的不重复加
              if l.startswith('External/simple-init/'):
                  return l
              return 'External/simple-init/' + l

          libs = [prefix(l) for l in libs]
          comps = [prefix(l) for l in comps]

          with open(dsc, 'a') as f:
              f.write('\n# ===== SimpleInit injected begin =====\n')
              f.write('[LibraryClasses]\n')
              for l in libs:
                  f.write(l + '\n')
              f.write('\n[Components]\n')
              for c in comps:
                  f.write(c + '\n')
              f.write('# ===== SimpleInit injected end =====\n')

          print(f'Injected {len(libs)} libs, {len(comps)} components')
          PYEOF

          echo "=== tail of DSC ==="
          tail -40 "$DSC"

      - name: Build UEFI
        run: |
          bash ./setup_env.sh -p apt
          python3 build_uefi.py -d aston

      - name: Locate outputs
        if: always()
        run: |
          echo "=== Mu-aston images ==="
          find . -iname "Mu-aston*" -not -path "./.git/*" 2>/dev/null || true
          echo "=== SimpleInit.efi ==="
          find . -iname "SimpleInit*.efi" -not -path "./.git/*" 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mu-aston-with-SimpleInit
          path: |
            **/Mu-aston*
            **/SimpleInit*.efi
          if-no-files-found: warn
          retention-days: 30
