name: Build Mu-aston with SimpleInit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Checkout Mu-Silicium
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Clone simple-init
        run: |
          rm -rf External
          mkdir -p External
          git clone --recursive --depth 1 \
            https://github.com/BigfootACA/simple-init.git \
            External/simple-init

      - name: Verify simple-init layout
        run: |
          echo "=== simple-init root ==="
          ls -la External/simple-init/
          echo "=== Looking for SimpleInit.dec ==="
          find External/simple-init -maxdepth 2 -name "SimpleInit.dec"
          echo "=== Looking for SimpleInit.inc ==="
          find External/simple-init -maxdepth 2 -name "SimpleInit.inc"

      - name: Patch build_uefi.py to add simple-init to PACKAGES_PATH
        run: |
          cp build_uefi.py build_uefi.py.bak

          python3 << 'PYEOF'
          import os
          pwd = os.environ['PWD']
          extra = pwd + '/External/simple-init'

          with open('build_uefi.py', 'r') as f:
              content = f.read()

          if 'External/simple-init' in content:
              print('Already patched, skipping.')
          else:
              import re
              # 覆盖所有可能的写法
              patterns = [
                  (r"(PACKAGES_PATH\s*=\s*)", r"\1'" + extra + ":' + "),
                  (r"(['\"]PACKAGES_PATH['\"]\s*:\s*)", r"\1'" + extra + ":' + "),
              ]
              patched = False
              for pat, repl in patterns:
                  new_content, n = re.subn(pat, repl, content, count=1)
                  if n:
                      content = new_content
                      patched = True
                      break

              if not patched:
                  print('WARN: no PACKAGES_PATH assignment found in build_uefi.py')
                  print('Dumping first 80 lines for debugging:')
                  print('\n'.join(content.splitlines()[:80]))
                  raise SystemExit(1)

              with open('build_uefi.py', 'w') as f:
                  f.write(content)
              print('Patched build_uefi.py')

          print('=== PACKAGES_PATH references ===')
          PYEOF

          grep -n "PACKAGES_PATH" build_uefi.py

      - name: Patch aston.dsc with SimpleInit components
        run: |
          DSC="Platforms/OnePlus/astonPkg/aston.dsc"
          INC="External/simple-init/SimpleInit.inc"

          [ -f "$DSC" ] || { echo "ERROR: $DSC not found"; exit 1; }
          [ -f "$INC" ] || { echo "ERROR: $INC not found"; exit 1; }

          if grep -q "SimpleInit" "$DSC"; then
            echo "DSC already patched."
            exit 0
          fi

          python3 << 'PYEOF'
          dsc_path = "Platforms/OnePlus/astonPkg/aston.dsc"
          inc_path = "External/simple-init/SimpleInit.inc"

          def extract_section(path, section):
              out, inside = [], False
              for line in open(path):
                  s = line.strip()
                  if s == '[' + section + ']':
                      inside = True
                      continue
                  if inside and s.startswith('[') and s.endswith(']'):
                      break
                  if inside:
                      out.append(line.rstrip('\n'))
              return out

          libs = [l for l in extract_section(inc_path, 'LibraryClasses') if l.strip()]
          comps = [l for l in extract_section(inc_path, 'Components') if l.strip()]

          with open(dsc_path, 'a') as f:
              f.write('\n# ===== SimpleInit injected begin =====\n')
              f.write('[LibraryClasses]\n')
              for l in libs:
                  f.write(l + '\n')
              f.write('\n[Components]\n')
              for c in comps:
                  f.write(c + '\n')
              f.write('# ===== SimpleInit injected end =====\n')

          print(f'Injected {len(libs)} libs, {len(comps)} components')
          PYEOF

          echo "=== tail of DSC ==="
          tail -40 "$DSC"

      - name: Build UEFI for aston
        run: |
          bash ./setup_env.sh -p apt
          python3 build_uefi.py -d aston

      - name: Locate outputs
        if: always()
        run: |
          echo "=== Mu-aston images ==="
          find . -iname "Mu-aston*" -not -path "./.git/*" 2>/dev/null || true
          echo "=== SimpleInit.efi ==="
          find . -iname "SimpleInit*.efi" -not -path "./.git/*" 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mu-aston-with-SimpleInit
          path: |
            **/Mu-aston*
            **/SimpleInit*.efi
          if-no-files-found: warn
          retention-days: 30
